// Κάρτα εικόνας 1080×1080: σχεδιάζεται τοπικά (canvas), χωρίς εξωτερικές υπηρεσίες.
function drawCard(r) {
  const S = 1080, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d"), font = (w, px) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  const emoji = px => `${px}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  const bg = g.createLinearGradient(0, 0, S, S);
  bg.addColorStop(0, "#15325c"); bg.addColorStop(1, "#0b1a30");
  g.fillStyle = bg; g.fillRect(0, 0, S, S);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillStyle = "#ffffff"; g.font = font(800, 64); g.fillText("Four Choices", S / 2, 130);
  const lvl = LEVELS[r.level][state.lang];
  const [y, m, d] = r.key.split("-").map(Number);
  g.fillStyle = "#c9d6e6"; g.font = font(500, 40);
  g.fillText(`${lvl} · ${T().date(new Date(y, m - 1, d))}`, S / 2, 200);
  g.fillStyle = "#ffffff"; g.font = font(800, 220); g.fillText(String(r.score), S / 2, 450);
  g.fillStyle = "#c9d6e6"; g.font = font(600, 44);
  g.fillText(`${T().cardCorrect(r.correct, r.total)} · ⚡ ${r.instant || 0}`, S / 2, 530);
  const marks = Array.from(r.grid || ""), cell = 88, x0 = S / 2 - (marks.length * cell) / 2 + cell / 2;
  g.font = emoji(68);
  marks.forEach((ch, i) => g.fillText(ch, x0 + i * cell, 680));
  const st = stats(r.level), t = totals(P());
  g.fillStyle = "#ffffff"; g.font = font(600, 44);
  g.fillText(`${T().cardStreak(st.streak)} · ${rankName(t.points)}`, S / 2, 800);
  g.fillStyle = r.leaves ? "#ff8a80" : "#6fd3a0"; g.font = font(600, 36);
  g.fillText(r.leaves ? T().unfair(r.leaves) : T().fair, S / 2, 870);
  if (/^https?:$/.test(location.protocol)) {
    g.fillStyle = "#9fb3c8"; g.font = font(500, 32);
    g.fillText((location.host + location.pathname).replace(/index\.html$/, "").replace(/\/$/, ""), S / 2, 1010);
  }
  return c;
}
async function shareCard() {
  const r = lastResult, c = drawCard(r), msg = $("shareMsg");

// Ενημέρωση ερωτήσεων: κατεβάζει ξανά όλα τα αρχεία από τον server (παρακάμπτοντας την αποθήκη offline).
async function refreshQuestions() {
  if (location.protocol === "file:") { location.reload(); return; }
  $("refreshMsg").textContent = T().refreshing;
  try {
    const res = await fetch("questions.js", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    if ("caches" in window) for (const k of await caches.keys()) await caches.delete(k);
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    location.reload();
  } catch {
    $("refreshMsg").textContent = T().refreshFail;
  }
}

$("openProfile2").addEventListener("click", () => { profileBack = "result"; openProfile(); });
$("closeProfile").addEventListener("click", () => {
  if (profileBack === "result" && lastResult) renderResult({ ...lastResult, fresh: [] }); else goHome();
});
$("openSettings").addEventListener("click", () => { $("refreshMsg").textContent = ""; applyLang(); show("settings"); });
$("closeSettings").addEventListener("click", goHome);
$("speakAgain").addEventListener("click", speakQuestion);
$("speakEnable").addEventListener("click", () => { state.voice = "female"; save(); speakQuestion(); });
$("speakStop").addEventListener("click", stopSpeech);
if (TTS) speechSynthesis.onvoiceschanged = () => { if (!$("settings").classList.contains("hidden")) applyLang(); if (run) renderSpeechRow(); };
$("refresh").addEventListener("click", refreshQuestions);
$("openPlayers").addEventListener("click", openPlayers);
$("closePlayers").addEventListener("click", goHome);
$("addPlayer").addEventListener("click", openWelcome);
$("cancelCreate").addEventListener("click", openPlayers);
$("createPlayer").addEventListener("click", createPlayer);
$("pinOk").addEventListener("click", confirmPin);
$("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") confirmPin(); });
$("logout").addEventListener("click", logout);
$("showImport").addEventListener("click", () => { openPlayers(); $("importBox").classList.remove("hidden"); });
$("importToggle").addEventListener("click", () => $("importBox").classList.toggle("hidden"));
$("makeCode").addEventListener("click", async () => {
  const out = $("codeOut"), msg = $("playersMsg");
  out.value = exportCode(); out.hidden = false; out.select();
  try { await navigator.clipboard.writeText(out.value); msg.className = "msg ok"; msg.textContent = T().codeCopied; }
  catch { msg.className = "msg"; msg.textContent = T().codeShown; }
});
$("importCode").addEventListener("click", () => {
  const msg = $("playersMsg");
  try {
    const name = importCode($("codeIn").value);
    $("codeIn").value = ""; renderPlayers();
    msg.className = "msg ok"; msg.textContent = T().imported(name);
  } catch { msg.className = "msg bad"; msg.textContent = T().codeBad; }
});
document.addEventListener("keydown", e => {
  if (!run) return;
  if (run.answered) {   // Enter/→ = επόμενη (το Enter πάνω στο εστιασμένο κουμπί το χειρίζεται ήδη το click)
    if (e.key === "ArrowRight" || (e.key === "Enter" && document.activeElement !== $("nextBtn"))) { e.preventDefault(); advance(); }
    return;
  }
  const pos = "1234".indexOf(e.key);
  if (pos >= 0) answer(run.items[run.i].order[pos]);
});

applyMode();
save();
// Σύνδεσμος πρόκλησης (#c=…): κρατιέται μέχρι να υπάρξει παίκτης και σβήνει από τη διεύθυνση.
if (/^#c=C1-/.test(location.hash)) {
  pendingChallenge = decodeURIComponent(location.hash.slice(3));
  try { history.replaceState(null, "", location.pathname + location.search); } catch { /* π.χ. sandbox */ }
}
if (!Object.keys(state.profiles).length) openWelcome();
else if (!P()) openPlayers();
else goHome();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
