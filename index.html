<!doctype html>
<html lang="el" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Choices</title>
<meta name="description" content="Ημερήσιο κουίζ: 10 ερωτήσεις, 4 επιλογές, τρία επίπεδα.">
<meta name="theme-color" content="#15325c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* ==========================================================================
     Four Choices — σύστημα σχεδιασμού (v16)
     Ταυτότητα: «τέσσερα χρώματα, τέσσερις επιλογές» — τερακότα, Αιγαίο, ώχρα, ελιά — πάνω σε ζεστό χαρτί και βαθύ μπλε.
     Λειτουργίες: Αυτόματο (φωτεινό/σκοτεινό), Φως ήλιου (μέγιστη αντίθεση), Μπαταρία (καθαρό μαύρο, χωρίς κινήσεις).
     ========================================================================== */
  :root {
    --bg: #f3efe6; --bg2: #e9e2d3; --surface: #fffdf8; --surface2: #f7f3ea;
    --text: #16202e; --muted: #5d6676; --line: #e3dccc;
    --accent: #15325c; --accent-text: #ffffff;
    --ok: #1d7a4d; --ok-bg: #e2f2e8; --bad: #b42318; --bad-bg: #fbe5e1;
    --timer: #c08a1e; --instant: #8a5a00;
    --c1: #c4623a; --c2: #2f6fb3; --c3: #d29b2e; --c4: #5f8a45; --c3-text: #2b1d05;
    --badge-text: #ffffff;
    --shadow: 0 1px 2px rgba(22, 32, 46, .06), 0 14px 34px -14px rgba(22, 32, 46, .22);
    --shadow-lift: 0 2px 4px rgba(22, 32, 46, .08), 0 18px 40px -16px rgba(22, 32, 46, .32);
    --border: 1px; --radius: 22px; --base: 17px; --q: 22px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;
  }
  /* Αυτόματο σε σκοτεινό θέμα συσκευής (ή περιβάλλοντος, data-theme) */
  @media (prefers-color-scheme: dark) {
    :root[data-mode="auto"]:not([data-theme="light"]) {
      --bg: #0c1117; --bg2: #121c28; --surface: #151d27; --surface2: #1b2531;
      --text: #edf0f4; --muted: #9ba5b3; --line: #27323f;
      --accent: #8fbaf0; --accent-text: #0a1424;
      --ok: #6fd3a0; --ok-bg: #143022; --bad: #ff8a80; --bad-bg: #3a1c1a; --timer: #f0b84a; --instant: #f0b84a;
      --c1: #e3845c; --c2: #6fa6e6; --c3: #e9b54d; --c4: #8fb872; --c3-text: #1f1502; --badge-text: #0b1320;
      --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 18px 44px -18px rgba(0, 0, 0, .7);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 50px -18px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }
  :root[data-mode="auto"][data-theme="dark"] {
    --bg: #0c1117; --bg2: #121c28; --surface: #151d27; --surface2: #1b2531;
    --text: #edf0f4; --muted: #9ba5b3; --line: #27323f;
    --accent: #8fbaf0; --accent-text: #0a1424;
    --ok: #6fd3a0; --ok-bg: #143022; --bad: #ff8a80; --bad-bg: #3a1c1a; --timer: #f0b84a; --instant: #f0b84a;
    --c1: #e3845c; --c2: #6fa6e6; --c3: #e9b54d; --c4: #8fb872; --c3-text: #1f1502; --badge-text: #0b1320;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 18px 44px -18px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 50px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
  /* Φως ήλιου: μέγιστη αντίθεση, μεγαλύτερα γράμματα, χοντρά περιγράμματα, χωρίς σκιές */
  :root[data-mode="sun"] {
    --bg: #ffffff; --bg2: #ffffff; --surface: #ffffff; --surface2: #ffffff;
    --text: #000000; --muted: #1a1a1a; --line: #000000;
    --accent: #000000; --accent-text: #ffffff;
    --ok: #005a2b; --ok-bg: #c9f2d9; --bad: #9a0000; --bad-bg: #ffd1d1; --timer: #000000; --instant: #5a3a00;
    --c1: #000000; --c2: #000000; --c3: #000000; --c4: #000000; --c3-text: #ffffff; --badge-text: #ffffff;
    --shadow: none; --shadow-lift: none; --border: 3px; --base: 19px; --q: 24px;
  }
  /* Μπαταρία: καθαρό μαύρο (σβηστά pixel σε OLED), χωρίς σκιές και κινήσεις */
  :root[data-mode="saver"] {
    --bg: #000000; --bg2: #000000; --surface: #000000; --surface2: #0a0a0a;
    --text: #c8c8c8; --muted: #7a7a7a; --line: #262626;
    --accent: #6f8fb8; --accent-text: #000000;
    --ok: #5fae84; --ok-bg: #0b1f14; --bad: #d07070; --bad-bg: #241010; --timer: #8a7440; --instant: #a88c4a;
    --c1: #8a5a46; --c2: #4f6d91; --c3: #8a7440; --c4: #566e47; --c3-text: #000000; --badge-text: #000000;
    --shadow: none; --shadow-lift: none;
    color-scheme: dark;
  }
  :root[data-mode="saver"] *, :root[data-mode="saver"] *::before { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  :root[data-mode="sun"] .opt, :root[data-mode="sun"] .card { font-weight: 650; }

  /* ---------- Βάση ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: var(--base)/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100dvh; display: flex; justify-content: center;
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  :root[data-mode="auto"] body { background: radial-gradient(120% 55% at 50% -12%, var(--bg2), var(--bg) 62%) fixed; }
  main { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---------- Κεφαλίδα ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; white-space: nowrap; }
  .logo { display: grid; grid-template-columns: repeat(2, 11px); gap: 3px; transform: rotate(-4deg); }
  .logo i { width: 11px; height: 11px; border-radius: 3.5px; display: block; }
  .logo i:nth-child(1) { background: var(--c1); } .logo i:nth-child(2) { background: var(--c2); }
  .logo i:nth-child(3) { background: var(--c3); } .logo i:nth-child(4) { background: var(--c4); }
  .word { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .word b { color: var(--accent); font-weight: 700; font-style: italic; }
  .seg { display: flex; background: var(--surface2); border: var(--border) solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600;
    border-radius: 999px; cursor: pointer; transition: background .18s, color .18s; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); box-shadow: 0 2px 8px -3px rgba(0, 0, 0, .35); }
  .seg.wide { border-radius: 16px; }
  .seg.wide button { flex: 1; padding: 11px 6px; font-size: 14.5px; border-radius: 13px; line-height: 1.25; }
  .icon-btn, .chip { border: var(--border) solid var(--line); background: var(--surface); color: var(--text); box-shadow: var(--shadow);
    cursor: pointer; font: inherit; transition: transform .12s, box-shadow .18s; }
  .icon-btn { border-radius: 999px; width: 40px; height: 40px; font-size: 18px; display: grid; place-items: center; padding: 0; }
  .chip { border-radius: 999px; height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600;
    max-width: 8em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn:active, .chip:active, .avatar:active { transform: scale(.96); }
  .avatar { width: 40px; height: 40px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--c2), var(--accent)); color: #fff; font: inherit; font-weight: 800; font-size: 17px;
    box-shadow: var(--shadow); transition: transform .12s; }
  :root[data-mode="sun"] .avatar { background: #000; } :root[data-mode="saver"] .avatar { background: var(--c2); color: #000; }

  /* ---------- Κάρτες και τυπογραφία ---------- */
  .card { background: var(--surface); border: var(--border) solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  h1 { font-family: var(--serif); font-size: 30px; line-height: 1.15; letter-spacing: -.015em; margin: 0 0 6px; font-weight: 700; }
  h2 { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 6px 0 8px; font-weight: 700; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13.5px; line-height: 1.5; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- Κουμπιά ---------- */
  .primary, .secondary { width: 100%; border-radius: 16px; font: inherit; cursor: pointer; transition: transform .12s, box-shadow .18s, background .18s; }
  .primary { border: 0; padding: 17px 18px; font-weight: 700; font-size: 17.5px; letter-spacing: .01em;
    background: var(--accent); color: var(--accent-text); box-shadow: 0 10px 24px -12px rgba(21, 50, 92, .65); }
  .secondary { border: var(--border) solid var(--line); padding: 15px 18px; font-weight: 600; background: var(--surface); color: var(--text); }
  .primary:active, .secondary:active { transform: translateY(1px) scale(.99); }
  .primary:disabled, .secondary:disabled { opacity: .45; cursor: default; transform: none; }
  @media (hover: hover) { .secondary:hover:not(:disabled) { background: var(--surface2); } .primary:hover:not(:disabled) { box-shadow: 0 14px 28px -12px rgba(21, 50, 92, .75); } }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14.5px; font-weight: 600; padding: 6px 0; cursor: pointer;
    text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .danger { color: var(--bad); }

  /* ---------- Φόρμες ---------- */
  input[type="text"], input[type="password"], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface2);
    border: var(--border) solid var(--line); border-radius: 14px; padding: 13px 14px; transition: border-color .18s, box-shadow .18s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  textarea { min-height: 84px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .msg { min-height: 1.2em; font-size: 14px; margin: 0; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }

  /* ---------- Αρχική ---------- */
  .playerline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .playerline b { color: var(--text); font-weight: 700; }
  #home h1 { font-size: 34px; margin-top: 4px; }
  #rules { font-size: 15.5px; line-height: 1.55; }
  #dateLine { font-family: var(--serif); font-style: italic; font-size: 16px; }
  #startDaily { font-size: 19px; padding: 19px; }

  /* ---------- Παιχνίδι: κεφαλίδα, κουκίδες προόδου, κλεψύδρα ---------- */
  .gamehead { display: flex; align-items: center; gap: 14px; }
  .gh-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
  .cat { padding: 3px 10px; border-radius: 999px; background: var(--surface2); border: var(--border) solid var(--line); color: var(--text); font-size: 13px; }
  .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .dots span { height: 6px; border-radius: 999px; background: var(--line); transition: background .2s, transform .2s; }
  .dots span.cur { background: var(--accent); transform: scaleY(1.35); }
  .dots span.inst { background: var(--timer); } .dots span.ok { background: var(--ok); } .dots span.bad { background: var(--bad); }
  .dots span.to { background: var(--muted); opacity: .55; } .dots span.left { background: var(--text); }
  /* Κλεψύδρα: δαχτυλίδι που αδειάζει, με τα δευτερόλεπτα στη μέση */
  .timer { position: relative; flex: 0 0 auto; width: 64px; height: 64px; display: grid; place-items: center; }
  .timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke-width: 5; }
  .timer .track { stroke: var(--line); }
  .timer .ring { stroke: var(--timer); stroke-linecap: round; stroke-dasharray: 119.38; stroke-dashoffset: 0; transition: stroke .2s; }
  #timeLeft { position: relative; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: -.02em; }
  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  :root[data-mode="sun"] .bar { height: 14px; }
  .bar > div { height: 100%; background: var(--timer); width: 100%; transform-origin: left; border-radius: 999px; }
  /* Τελευταία δευτερόλεπτα: κόκκινο και παλμός */
  #game.urgent #timerBar { background: var(--bad); animation: fc-pulse .8s ease-in-out infinite alternate; }
  #game.urgent #timeLeft { color: var(--bad); font-weight: 800; }
  #game.urgent .timer .ring { stroke: var(--bad); }
  @keyframes fc-pulse { from { opacity: 1; } to { opacity: .45; } }
  @keyframes fc-beat { from { transform: scale(1); } to { transform: scale(1.08); } }
  /* Χαλαρή εξάσκηση: χωρίς χρόνο */
  #game.relaxed .bar, #game.relaxed .timer svg { visibility: hidden; }
  #game.relaxed #timeLeft { font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--surface2); }

  /* ---------- Παιχνίδι: ερώτηση και επιλογές ---------- */
  #shareMsg { white-space: pre-line; -webkit-user-select: text; user-select: text; }
  #game { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .question { font-family: var(--serif); font-size: var(--q); line-height: 1.32; font-weight: 700; letter-spacing: -.005em; min-height: 2.7em; margin: 6px 0 0; }
  .speechrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .speechrow .chip { max-width: none; height: 36px; font-size: 13.5px; }
  .options { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 62px; text-align: left; line-height: 1.3;
    border: var(--border) solid var(--line); border-radius: 18px; padding: 10px 14px 10px 10px; font: inherit; font-weight: 550;
    background: var(--surface); color: var(--text); cursor: pointer; box-shadow: 0 1px 0 var(--line);
    transition: transform .12s, border-color .18s, background .18s, box-shadow .18s;
  }
  @media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--accent); box-shadow: var(--shadow); } }
  .opt:active:not(:disabled) { transform: scale(.985); }
  .opt .key {
    flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    font-weight: 800; font-size: 17px; color: var(--badge-text);
  }
  :root[data-mode="sun"] .opt .key { color: #fff !important; }
  .opt .mark { margin-left: auto; font-weight: 800; font-size: 20px; }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.correct):not(.wrong) { opacity: .62; }
  :root[data-mode="sun"] .opt:disabled:not(.correct):not(.wrong) { opacity: 1; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 0 0 2px var(--ok) inset; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 0 0 2px var(--bad) inset; }
  .opt.correct .key { background: var(--ok) !important; color: #fff !important; }
  .opt.wrong .key { background: var(--bad) !important; color: #fff !important; }
  .opt.correct .mark::after { content: "✓"; color: var(--ok); }
  .opt.wrong .mark::after { content: "✗"; color: var(--bad); }
  .feedback { min-height: 1.5em; font-weight: 800; text-align: center; font-size: 18px; letter-spacing: .01em; }
  .feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
  .feedback .instant { color: var(--instant); }
  /* Εξήγηση μετά την απάντηση */
  .explain { border-left: 4px solid var(--c2); background: var(--surface2); border-radius: 14px; padding: 12px 14px; font-size: 15.5px; line-height: 1.55; }
  .explain p { margin: 0 0 6px; }
  .explain a, .review a { color: var(--accent); font-size: 13.5px; font-weight: 600; }
  #game .explain { -webkit-user-select: text; user-select: text; }
  /* «Επόμενη»: κολλημένο στο κάτω μέρος της οθόνης, πάντα ορατό χωρίς σύρσιμο */
  #nextBtn { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 5;
    box-shadow: 0 14px 34px -10px rgba(10, 20, 36, .55), 0 0 0 6px var(--surface); }

  /* ---------- Αποτέλεσμα ---------- */
  #resultLabel { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .score { font-family: var(--serif); font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: -.03em; margin: 10px 0 8px; color: var(--accent); font-variant-numeric: tabular-nums; }
  #resultCorrect { font-size: 18px; font-weight: 700; }
  .grid { font-size: min(26px, 7.2vw); letter-spacing: 1px; white-space: nowrap; margin: 12px 0 6px; overflow: hidden; }
  .legend { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  .badge { display: inline-block; border: var(--border) solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .badge.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 14px 0; }
  @media (max-width: 380px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stats div { background: var(--surface2); border: var(--border) solid var(--line); border-radius: 16px; padding: 12px 4px; min-width: 0; }
  .stats b { display: block; font-family: var(--serif); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stats small { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  #result .stack { margin-top: 6px; }
  #nextIn { font-family: var(--serif); font-style: italic; }

  /* ---------- Παίκτες ---------- */
  .players { display: flex; flex-direction: column; gap: 8px; }
  .player { background: var(--surface2); border: var(--border) solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .player.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .player .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .player .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .player .pts { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }

  /* ---------- Ανασκόπηση, ειδοποιήσεις, σύγκριση, κάρτα ---------- */
  details.review { margin: 4px 0 12px; }
  details.review summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
  .review ol { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .review li { background: var(--surface2); border: var(--border) solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; }
  .review li b { display: block; margin-bottom: 4px; }
  .review .ans { color: var(--ok); font-weight: 700; }
  .toast { border: var(--border) solid var(--c3); background: color-mix(in srgb, var(--c3) 12%, var(--surface)); color: var(--text);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 14.5px; }
  .toast b { color: var(--instant); }
  #vsBox div { font-variant-numeric: tabular-nums; }
  #vsBox .verdict { font-family: var(--serif); font-weight: 700; font-size: 22px; margin-bottom: 6px; }
  #vsBox .vsgrid { white-space: nowrap; letter-spacing: 1px; margin-bottom: 6px; }
  #cardImg { width: 100%; border-radius: 16px; border: var(--border) solid var(--line); }

  /* ---------- Στατιστικά, επιτεύγματα, δείκτες, ιστορικό ---------- */
  .cats { display: flex; flex-direction: column; gap: 10px; }
  .catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 14.5px; }
  .catrow .bar { grid-column: 1 / -1; height: 7px; }
  .catrow .bar > div { background: var(--ok); }
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 8px; }
  .ach { background: var(--surface2); border: var(--border) solid var(--line); border-radius: 16px; padding: 10px 12px; font-size: 13px; min-width: 0; }
  .ach .ic { font-size: 26px; }
  .ach b { display: block; font-size: 14px; }
  .ach.locked { opacity: .45; }
  .ach.locked .ic { filter: grayscale(1); }
  .lvltable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .lvltable th, .lvltable td { border-bottom: 1px solid var(--line); padding: 7px 3px; text-align: right; }
  .lvltable th { color: var(--muted); font-weight: 700; font-size: 12px; }
  .lvltable th:first-child, .lvltable td:first-child { text-align: left; }
  .lvltable tr.all td { font-weight: 800; }
  .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hist button { width: 100%; text-align: left; background: var(--surface2); border: var(--border) solid var(--line); border-radius: 16px; padding: 10px 12px;
    color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .hist .g { display: block; letter-spacing: 1px; white-space: nowrap; font-size: 15px; margin-top: 2px; overflow: hidden; }

  /* ---------- Γενικά ---------- */
  .hidden { display: none !important; }
  footer { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; padding: 4px 8px 8px; }
  #appVer { display: block; font-weight: 700; letter-spacing: .04em; margin-top: 2px; }
  :focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  /* ---------- Κύκλος επιλογών (v17): τέσσερα τεταρτημόρια, κλεψύδρα στο κέντρο ---------- */
  .opt:nth-child(1) { --q-c: var(--c1); } .opt:nth-child(2) { --q-c: var(--c2); }
  .opt:nth-child(3) { --q-c: var(--c3); } .opt:nth-child(4) { --q-c: var(--c4); }
  .opt .key { background: var(--q-c); }
  .opt:nth-child(3) .key { color: var(--c3-text); }
  .dial { position: relative; width: min(100%, 380px); margin: 4px auto 0; }
  .dial:not(.list) .options { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; aspect-ratio: 1;
    border-radius: 50%; overflow: hidden; background: var(--line); box-shadow: var(--shadow-lift); }
  .dial:not(.list) .opt { border: 0; border-radius: 0; min-height: 0; height: 100%; box-shadow: none; position: relative;
    flex-direction: column; justify-content: center; gap: 6px; text-align: center; font-weight: 650;
    background: color-mix(in srgb, var(--q-c) 13%, var(--surface)); transition: background .18s, filter .18s; }
  /* Το περιεχόμενο κάθε τεταρτημορίου κεντράρεται ~0,55 ακτίνας από το κέντρο (εκεί είναι ο μεγαλύτερος ελεύθερος χώρος,
     μακριά από την καμπύλη και από την κλεψύδρα). Περιθώρια: έξω 28%, προς το κέντρο 18% της πλευράς του τεταρτημορίου. */
  .dial:not(.list) .opt:nth-child(1) { padding: 27% 14% 16% 25%; }
  .dial:not(.list) .opt:nth-child(2) { padding: 27% 25% 16% 14%; }
  .dial:not(.list) .opt:nth-child(3) { padding: 16% 14% 27% 25%; }
  .dial:not(.list) .opt:nth-child(4) { padding: 16% 25% 27% 14%; }
  .dial:not(.list) .opt .key { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 999px; font-size: 15px; }
  .dial:not(.list) .opt .txt { font-size: 16px; line-height: 1.2; overflow-wrap: break-word; max-width: 100%; }
  .dial:not(.list) .opt .txt.len-m { font-size: 14.5px; } .dial:not(.list) .opt .txt.len-l { font-size: 13px; }
  .dial:not(.list) .opt .txt.len-w { font-size: 12.5px; letter-spacing: -.01em; }
  .dial:not(.list) .opt .mark { display: none; }
  @media (hover: hover) { .dial:not(.list) .opt:hover:not(:disabled) { background: color-mix(in srgb, var(--q-c) 26%, var(--surface)); box-shadow: none; } }
  .dial:not(.list) .opt:active:not(:disabled) { transform: none; filter: brightness(.96); }
  .opt.picked:not(.correct):not(.wrong) { background: color-mix(in srgb, var(--q-c) 34%, var(--surface)); }
  .dial:not(.list) .opt.correct { background: var(--ok); color: #fff; box-shadow: none; animation: fc-reveal .5s ease-out; }
  .dial:not(.list) .opt.wrong { background: var(--bad); color: #fff; box-shadow: none; animation: fc-shake .38s ease-in-out; }
  .dial:not(.list) .opt.correct .key { background: #fff !important; color: var(--ok) !important; font-size: 0; }
  .dial:not(.list) .opt.wrong .key { background: #fff !important; color: var(--bad) !important; font-size: 0; }
  .dial:not(.list) .opt.correct .key::after { content: "✓"; font-size: 19px; }
  .dial:not(.list) .opt.wrong .key::after { content: "✗"; font-size: 19px; }
  .dial:not(.list) .opt:disabled:not(.correct):not(.wrong) { opacity: .5; }
  :root[data-mode="sun"] .dial:not(.list) .opt:disabled:not(.correct):not(.wrong) { opacity: 1; }
  :root[data-mode="sun"] .dial:not(.list) .options { background: #000; }
  @keyframes fc-reveal { 0% { filter: brightness(1.22) saturate(.8); } 55% { filter: brightness(1.08); } 100% { filter: none; } }
  @keyframes fc-shake { 0%, 100% { translate: 0; } 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
  /* Κέντρο του κύκλου: η κλεψύδρα */
  .hub.timer { position: absolute; left: 50%; top: 50%; width: 27%; height: auto; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 6px var(--line), var(--shadow-lift); pointer-events: none; z-index: 2; }
  .hub #timeLeft { font-size: clamp(22px, 7vw, 30px); }
  :root[data-mode="sun"] .hub.timer { box-shadow: 0 0 0 6px #000; }
  .dial.list { display: flex; flex-direction: column; }
  .dial.list .hub.timer { order: -1; position: relative; left: auto; top: auto; translate: none; width: 72px; margin: 0 auto 12px; box-shadow: var(--shadow); }
  #game.urgent .hub.timer { animation: fc-beat .8s ease-in-out infinite alternate; }
  #game[data-level="3"].urgent .hub.timer { animation-duration: .5s; }
  #game.relaxed .hub #timeLeft { font-size: 12px; line-height: 1.2; text-align: center; background: none; padding: 0 8px; }
  /* Ατμόσφαιρα ανά δυσκολία (μόνο στο «Αυτόματο»): το Ανώτερο «ζεσταίνει», το Expert «βραδιάζει».
     Η αντίθεση κειμένου μένει πάνω από WCAG AA (Expert: λευκό σε βαθύ μπλε ≈ 14:1). */
  :root[data-mode="auto"] #game[data-level="2"] { background: color-mix(in srgb, var(--c3) 8%, var(--surface)); }
  :root[data-mode="auto"] #game[data-level="3"] {
    --surface: #13233d; --surface2: #1a2e4d; --text: #f1f4f8; --muted: #b3c0d2; --line: #2a4166;
    --accent: #a8c9f5; --accent-text: #0a1424; --timer: #f0b84a; --instant: #f0b84a;
    --ok: #2fae6e; --ok-bg: #133b2a; --bad: #e5574b; --bad-bg: #3d1f22; --badge-text: #ffffff; --c3-text: #1f1502;
    background: radial-gradient(130% 80% at 50% 0%, #1d3557, #13233d 60%); color: var(--text); border-color: #2a4166; }
  :root[data-mode="auto"] #game[data-level="3"] .dial:not(.list) .opt { background: color-mix(in srgb, var(--q-c) 10%, var(--surface)); color: var(--text); }
  :root[data-mode="auto"] #game[data-level="3"] .dial:not(.list) .opt.correct,
  :root[data-mode="auto"] #game[data-level="3"] .dial:not(.list) .opt.wrong { color: #fff; }
  /* Ανάγνωση: κουμπιά */
  .speechrow .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #speechNote { font-size: 13px; }
  .voicelist { margin-top: 6px; } .voicelist summary { cursor: pointer; color: var(--muted); }
  .voicelist ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  #homeNext, #meanwhile { text-align: center; margin: 0; }
  .secondary.endless { border-color: var(--c2); color: var(--accent); font-weight: 700;
    background: color-mix(in srgb, var(--c2) 9%, var(--surface)); }
  .session { font-weight: 700; margin: 2px 0 6px; color: var(--accent); }
  /* Συνεχές: «Επόμενος γύρος» πρώτο, χωρίς τα στατιστικά του ημερήσιου */
  #result.endless .stats { display: none; } #result.endless #again { order: -1; }
  #nextIn { font-variant-numeric: tabular-nums; }
  /* Γιορτή: αστεράκια που «σκάνε», αναπήδηση μηνύματος */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .fx i { position: absolute; font-style: normal; font-size: var(--s, 16px); line-height: 1; translate: -50% -50%;
    text-shadow: 0 0 10px currentColor; animation: fc-star .85s cubic-bezier(.15, .75, .3, 1) forwards; }
  @keyframes fc-star { 0% { transform: translate(0, 0) scale(.2) rotate(0deg); opacity: 1; } 70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; } }
  .feedback.pop { animation: fc-pop .42s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes fc-pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @media (max-width: 400px) {
    header { gap: 6px; } .word { font-size: 19px; } .brand { gap: 8px; }
    .seg:not(.wide) button { padding: 6px 10px; }
    .card { padding: 18px 16px; border-radius: 20px; }
    h1 { font-size: 27px; } #home h1 { font-size: 30px; }
    .question { font-size: calc(var(--q) - 1px); }
    .opt { min-height: 58px; }
    .score { font-size: 64px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="word">Four <b>Choices</b></span></div>
    <button id="openPlayers" class="avatar" type="button"></button>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="el">ΕΛ</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button id="openSettings" class="icon-btn" type="button" aria-label="Ρυθμίσεις">⚙</button>
  </header>

  <!-- Καλωσόρισμα: πρώτη χρήση, δημιουργία παίκτη -->
  <section id="welcome" class="card stack hidden">
    <h1 data-t="welcomeTitle"></h1>
    <p class="muted" data-t="welcomeText"></p>
    <div><label for="newName" data-t="nickname"></label><input id="newName" type="text" maxlength="20" autocomplete="nickname"></div>
    <div><label for="newPin" data-t="pinOptional"></label><input id="newPin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>
    <p id="welcomeMsg" class="msg"></p>
    <button id="createPlayer" class="primary" type="button" data-t="createPlayer"></button>
    <button id="cancelCreate" class="secondary hidden" type="button" data-t="back"></button>
    <button id="showImport" class="link" type="button" data-t="haveCode"></button>
  </section>

  <!-- Παίκτες: σύνδεση, αλλαγή, κατάταξη συσκευής, μεταφορά -->
  <section id="players" class="card stack hidden">
    <h1 data-t="playersTitle"></h1>
    <p class="muted small" data-t="playersText"></p>
    <div id="playerList" class="players"></div>
    <div id="pinBox" class="stack hidden">
      <label for="pinInput" id="pinLabel"></label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password">
      <button id="pinOk" class="primary" type="button" data-t="login"></button>
    </div>
    <p id="playersMsg" class="msg"></p>
    <button id="addPlayer" class="secondary" type="button" data-t="newPlayer"></button>
    <div class="stack">
      <h2 data-t="transferTitle"></h2>
      <p class="muted small" data-t="transferText"></p>
      <button id="makeCode" class="secondary" type="button" data-t="makeCode"></button>
      <textarea id="codeOut" readonly hidden aria-label="Transfer code"></textarea>
      <button id="importToggle" class="link" type="button" data-t="haveCode"></button>
      <div id="importBox" class="stack hidden">
        <label for="codeIn" data-t="pasteCode"></label>
        <textarea id="codeIn"></textarea>
        <button id="importCode" class="secondary" type="button" data-t="importCode"></button>
      </div>
    </div>
    <button id="logout" class="link" type="button" data-t="logout"></button>
    <button id="closePlayers" class="primary" type="button" data-t="back"></button>
  </section>

  <!-- Αρχική -->
  <section id="home" class="card stack hidden">
    <div class="playerline"><span id="homePlayer"></span><span id="homeTotal"></span></div>
    <h1 data-t="title"></h1>
    <p class="muted" id="rules"></p>
    <div>
      <h2 data-t="level"></h2>
      <div id="levels" class="seg wide" role="group"></div>
    </div>
    <p id="dateLine" class="muted" style="margin:0"></p>
    <button id="startDaily" class="primary" type="button"></button>
    <p id="homeNext" class="muted small hidden"></p>
    <button id="startEndless" class="secondary endless" type="button" data-t="endless"></button>
    <p id="endlessInfo" class="muted small" style="margin:0"></p>
    <button id="startPractice" class="secondary" type="button" data-t="practice"></button>
    <button id="startRelaxed" class="secondary" type="button" data-t="relaxed"></button>
    <p id="practiceInfo" class="muted small" style="margin:0"></p>
    <button id="startChallenge" class="secondary" type="button" data-t="challenge"></button>
    <p id="challengeInfo" class="muted small hidden" style="margin:0" data-t="chNone"></p>
    <button id="chToggle" class="link" type="button" data-t="haveChallenge"></button>
    <div id="chBox" class="stack hidden">
      <label for="chIn" data-t="pasteChallenge"></label>
      <textarea id="chIn"></textarea>
      <button id="chOpen" class="secondary" type="button" data-t="openChallenge"></button>
      <p id="chMsg" class="msg"></p>
    </div>
    <button id="openProfile" class="link" type="button" data-t="profileBtn"></button>
  </section>

  <!-- Πρόκληση φίλου: εισαγωγή πριν από το παιχνίδι -->
  <section id="challenge" class="card stack hidden">
    <h1 data-t="chTitle"></h1>
    <p id="chFrom"></p>
    <div class="grid" id="chGrid" aria-hidden="true"></div>
    <p class="muted small" data-t="chRules"></p>
    <p id="chWarn" class="muted small hidden"></p>
    <button id="chAccept" class="primary" type="button" data-t="chAccept"></button>
    <button id="chBack" class="secondary" type="button" data-t="back"></button>
  </section>

  <!-- Στατιστικά και επιτεύγματα του τρέχοντος παίκτη -->
  <section id="profile" class="card stack hidden">
    <h1 data-t="profileBtn"></h1>
    <p id="profileSummary" class="muted"></p>
    <div>
      <h2 data-t="kpiTitle"></h2>
      <div class="stats" style="margin-top:4px">
        <div><b id="kpiKnow"></b><small data-t="kpiKnow"></small></div>
        <div><b id="kpiSpeed"></b><small data-t="kpiSpeed"></small></div>
        <div><b id="kpiMean"></b><small data-t="kpiMean"></small></div>
        <div><b id="kpiInstant"></b><small data-t="kpiInstant"></small></div>
      </div>
      <h2 data-t="levelTitle"></h2>
      <table class="lvltable"><thead><tr id="lvlHead"></tr></thead><tbody id="lvlBody"></tbody></table>
      <p class="muted small" data-t="kpiDef" style="margin-top:6px"></p>
    </div>
    <div>
      <h2 data-t="histTitle"></h2>
      <p class="muted small" data-t="histNote"></p>
      <ol id="histList" class="hist"></ol>
    </div>
    <div>
      <h2 data-t="catTitle"></h2>
      <p class="muted small" data-t="catText"></p>
      <div id="catList" class="cats"></div>
    </div>
    <div>
      <h2 id="achTitle"></h2>
      <div id="achList" class="achs"></div>
    </div>
    <button id="closeProfile" class="primary" type="button" data-t="back"></button>
  </section>

  <!-- Ρυθμίσεις -->
  <section id="settings" class="card stack hidden">
    <h1 data-t="settings"></h1>
    <div>
      <h2 data-t="display"></h2>
      <div id="modes" class="seg wide" role="group"></div>
      <p class="muted small" id="modeHint" style="margin-top:6px"></p>
    </div>
    <div>
      <h2 data-t="speech"></h2>
      <div id="voices" class="seg wide" role="group"></div>
      <p class="muted small" id="voiceHint" style="margin-top:6px"></p>
      <details class="voicelist"><summary class="small" data-t="voiceListTitle"></summary><ul id="voiceList" class="small"></ul></details>
    </div>
    <div>
      <h2 data-t="sound"></h2>
      <div id="sounds" class="seg wide" role="group"></div>
      <p class="muted small" data-t="soundHint" style="margin-top:6px"></p>
    </div>
    <div>
      <h2 data-t="layout"></h2>
      <div id="layouts" class="seg wide" role="group"></div>
      <p class="muted small" data-t="layoutHint" style="margin-top:6px"></p>
    </div>
    <div>
      <h2 data-t="scoringTitle"></h2>
      <p class="muted small" data-t="scoringText"></p>
    </div>
    <div>
      <h2 data-t="questions"></h2>
      <p class="muted small" id="bankInfo"></p>
      <button id="refresh" class="secondary" type="button" data-t="refresh"></button>
      <p class="muted small" id="refreshMsg" style="margin-top:6px"></p>
    </div>
    <div>
      <h2 data-t="fairTitle"></h2>
      <p class="muted small" data-t="fairText"></p>
    </div>
    <button id="closeSettings" class="primary" type="button" data-t="back"></button>
  </section>

  <!-- Παιχνίδι -->
  <section id="game" class="card stack hidden" aria-live="polite">
    <div class="gamehead">
      <div class="gh-left">
        <div class="meta"><span id="progress"></span><span id="category" class="cat"></span></div>
        <div id="dots" class="dots" aria-hidden="true"></div>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><div id="timerBar"></div></div>
    <p id="question" class="question"></p>
    <div id="speechRow" class="speechrow hidden">
      <button id="speakEnable" class="chip" type="button" data-t="speakEnable"></button>
      <button id="speakAgain" class="chip on" type="button" data-t="speakAgain"></button>
      <button id="speakStop" class="chip" type="button" data-t="speakStop"></button>
      <span id="speechNote" class="muted hidden"></span>
    </div>
    <div class="dial" id="dial">
      <div id="options" class="options"></div>
      <div class="timer hub" id="timerBox">
        <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="19"/><circle id="timerRing" class="ring" cx="22" cy="22" r="19"/></svg>
        <span id="timeLeft"></span>
      </div>
    </div>
    <div id="feedback" class="feedback"></div>
    <div id="explain" class="explain hidden">
      <p id="explainText"></p>
      <a id="explainSrc" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <button id="nextBtn" class="primary hidden" type="button"></button>
  </section>

  <!-- Αποτέλεσμα -->
  <section id="result" class="card hidden">
    <div id="newAch" class="toast hidden" role="status"></div>
    <div id="vsBox" class="toast hidden" role="status"></div>
    <p class="muted" id="resultLabel" style="margin-bottom:4px"></p>
    <span id="fairBadge" class="badge"></span>
    <div class="score" id="resultScore"></div>
    <p id="resultCorrect" style="margin-bottom:4px"></p>
    <p id="resultInstant" class="small" style="margin-bottom:4px"></p>
    <p id="resultRules" class="muted small" style="margin-bottom:4px"></p>
    <p id="sessionLine" class="session hidden"></p>
    <div class="grid" id="resultGrid" aria-hidden="true"></div>
    <div class="legend" data-t="legend"></div>
    <p class="muted small hidden" id="offSchedule" data-t="offSchedule"></p>
    <div class="stats">
      <div><b id="statPlayed"></b><small data-t="played"></small></div>
      <div><b id="statStreak"></b><small data-t="streak"></small></div>
      <div><b id="statBest"></b><small data-t="best"></small></div>
      <div><b id="statTotal"></b><small data-t="total"></small></div>
    </div>
    <details id="reviewBox" class="review">
      <summary data-t="reviewTitle"></summary>
      <ol id="reviewList"></ol>
    </details>
    <div class="stack">
      <button id="share" class="primary" type="button" data-t="share"></button>
      <button id="shareCard" class="secondary" type="button" data-t="shareCard"></button>
      <p id="shareMsg" class="muted hidden" style="text-align:center;margin:0"></p>
      <img id="cardImg" class="hidden" alt="">
      <a id="cardSave" class="link hidden" style="text-align:center" data-t="cardSave"></a>
      <button id="openProfile2" class="secondary" type="button" data-t="profileBtn"></button>
      <button id="again" class="secondary" type="button" data-t="practice"></button>
      <button id="home2" class="secondary" type="button" data-t="home"></button>
      <p id="nextIn" class="muted" style="text-align:center;margin:0"></p>
      <p id="meanwhile" class="muted small hidden" data-t="meanwhile"></p>
    </div>

// ---------- αποθήκευση (προαιρετική: το παιχνίδι λειτουργεί και χωρίς αυτήν) ----------
function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* ιδιωτική περιήγηση κ.λπ. */ }
}
function newId() {
  return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function blankProfile(name) {
  return { name, pin: null, level: 1, days: {}, seen: [], stats: {}, ach: {}, created: new Date().toISOString() };
}
// Μεταφορά από την έκδοση v2 (ένας παίκτης ανά συσκευή) στην v3 (πολλοί παίκτες).
function migrate() {
  const s = readJSON(STORE);
  if (s && s.profiles) return s;
  const old = readJSON(OLD_STORE) || {};
  const st = { lang: old.lang || null, mode: old.mode || "auto", current: null, profiles: {} };
  if (old.days && Object.keys(old.days).length || (old.seen && old.seen.length)) {
    const id = newId();
    st.profiles[id] = { ...blankProfile("Παίκτης 1"), level: old.level || 1, days: old.days || {}, seen: old.seen || [] };
    st.current = id;
  }
  return st;
}
const state = migrate();
if (!UI[state.lang]) state.lang = (navigator.language || "el").toLowerCase().startsWith("el") ? "el" : "en";
if (!["auto", "sun", "saver"].includes(state.mode)) state.mode = "auto";
if (!["off", "female", "male"].includes(state.voice)) state.voice = "off";
if (!["on", "off"].includes(state.sound)) state.sound = "on";
if (!["circle", "list"].includes(state.layout)) state.layout = "circle";
const P = () => state.profiles[state.current] || null;   // τρέχων παίκτης
let SEEN = new Set();
function loadPlayer() {
  const p = P();
  SEEN = new Set(p && Array.isArray(p.seen) ? p.seen : []);
  if (!p) return;
  if (!LEVELS[p.level]) p.level = 1;
  if (!p.stats || typeof p.stats !== "object") p.stats = {};
  if (!p.ach || typeof p.ach !== "object") p.ach = {};
  tidyLive(p);             // μισοτελειωμένα ημερήσια προηγούμενων ημερών κλείνουν εδώ
  unlockAchievements(p);   // αναδρομικά, χωρίς ειδοποίηση (π.χ. παίκτης από παλαιότερη έκδοση)
}
loadPlayer();
function markSeen(id) {
  const p = P();
  if (!p || SEEN.has(id)) return;
  SEEN.add(id); p.seen = [...SEEN]; save();
}
const level = () => (P() ? P().level : 1);

// ---------- ομιλία: ανάγνωση ερωτήσεων (D28) ----------
// Μόνο φωνές αποθηκευμένες στη συσκευή (localService): οι «διαδικτυακές» φωνές στέλνουν το κείμενο σε server (Κ3).
// Οι συσκευές δεν δηλώνουν φύλο/ηλικία φωνής· το φύλο εκτιμάται από το όνομα, το ήρεμο ύφος από ρυθμό και τόνο.
const TTS = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
const VOICE_NAMES = {
  female: /melina|athina|eleni|maria|zira|hazel|susan|samantha|karen|moira|tessa|fiona|victoria|catherine|serena|kate|libby|sonia|aria|jenny|\bfemale\b|γυναικ/i,
  male: /stefanos|nikos|nikolaos|dimitris|kostas|giorgos|david|mark|george|james|daniel|\balex\b|fred|\btom\b|oliver|arthur|ryan|\bguy\b|\bmale\b|ανδρ/i
};
const VOICE_STYLE = { female: { rate: 0.9, pitch: 0.95 }, male: { rate: 0.9, pitch: 0.9 } };
function pickVoice(lang = state.lang, want = state.voice) {
  if (!TTS || want === "off") return { voice: null };
  const local = speechSynthesis.getVoices().filter(v => v.localService && (v.lang || "").toLowerCase().startsWith(lang));
  const other = want === "female" ? "male" : "female";
  const match = local.find(v => VOICE_NAMES[want].test(v.name) && !VOICE_NAMES[other].test(v.name));
  return { voice: match || local[0] || null, fallback: !match && local.length > 0 };
}
function renderVoiceList() {
  const ul = $("voiceList"), vs = TTS ? speechSynthesis.getVoices().filter(v => /^(el|en)/i.test(v.lang || "")) : [];
  ul.replaceChildren(...(vs.length ? vs.slice(0, 20) : [null]).map(v => {
    const li = document.createElement("li");
    li.textContent = v ? `${v.name} · ${v.lang} · ${v.localService ? T().voiceLocal : T().voiceRemote}` : T().voiceListEmpty;
    return li;
  }));
}
// Ενσωματωμένος browser εφαρμογής (Android WebView: «; wv)» στο user agent, ή γνωστές εφαρμογές): δεν έχει Web Speech API.
const IN_APP = /; wv\)|FBAN|FBAV|Instagram|Viber|WhatsApp|Line\/|MiuiBrowser|XiaoMi\//i.test(navigator.userAgent || "");
const noSpeechText = () => IN_APP ? T().speechWebView : T().speechUnsupported;
function voiceHint() {
  if (!TTS) return noSpeechText();
  if (state.voice === "off") return T().speechOff;
  const { voice, fallback } = pickVoice();
  return !voice ? T().speechNone : fallback ? T().speechFallback(state.voice, voice.name) : T().speechVoice(voice.name);
}
function stopSpeech() { clearTimeout(speechTimer); if (TTS) speechSynthesis.cancel(); }
// Chrome (κυρίως Android): ομιλία που ζητείται αμέσως μετά από cancel() μπορεί να αγνοηθεί, και η μηχανή μπορεί να μείνει
// «σε παύση». Γι' αυτό: resume() πριν από κάθε speak, και μικρή καθυστέρηση όταν κάτι μιλούσε ήδη.
let speechTimer = null;
function speakText(text) {
  const { voice } = pickVoice();
  if (!voice || !text) { stopSpeech(); return false; }
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text), style = VOICE_STYLE[state.voice];
  u.voice = voice; u.lang = voice.lang; u.rate = style.rate; u.pitch = style.pitch;
  const go = () => { try { speechSynthesis.resume(); } catch { /* παλιοί browsers */ } speechSynthesis.speak(u); };
  clearTimeout(speechTimer);
  if (busy) speechTimer = setTimeout(go, 150); else go();
  return true;
}
// Η γραμμή ανάγνωσης φαίνεται πάντα στο παιχνίδι (όπου ο browser υποστηρίζει ομιλία): κλειστή → «Ανάγνωση»,
// ανοιχτή → «Άκουσε ξανά»/«Σταμάτα», χωρίς φωνή στη συσκευή → μήνυμα.
function renderSpeechRow() {
  const row = $("speechRow");
  row.classList.toggle("hidden", !run);
  if (!run) return;
  if (!TTS) {                     // χωρίς μηχανή ομιλίας: μόνο εξήγηση, χωρίς κουμπιά
    ["speakEnable", "speakAgain", "speakStop"].forEach(id => $(id).classList.add("hidden"));
    $("speechNote").textContent = state.voice !== "off" ? noSpeechText() : "";
    $("speechNote").classList.toggle("hidden", state.voice === "off");
    row.classList.toggle("hidden", state.voice === "off");
    return;
  }
  const on = state.voice !== "off", voice = on && pickVoice().voice;
  $("speakEnable").classList.toggle("hidden", on);
  $("speakAgain").classList.toggle("hidden", !voice);
  $("speakStop").classList.toggle("hidden", !voice);
  $("speechNote").textContent = on && !voice ? T().speechMissing : "";
  $("speechNote").classList.toggle("hidden", !(on && !voice));
}
function speakQuestion() {
  renderSpeechRow();
  if (!run) return;
  const { q, order } = run.items[run.i], d = q[state.lang];
  speakText(`${d[0]} ` + order.map((o, pos) => `${T().keys[pos]}: ${d[1 + o]}.`).join(" "));
}

// ---------- ερωτήσεις και πρόγραμμα ----------
const BY_ID = new Map(QUESTIONS.map(q => [q.id, q]));
const SCHED = typeof SCHEDULE === "object" ? SCHEDULE : {};

function rng(seed) { // mulberry32
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function todayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayNumber(key) {
  const [y, m, d] = key.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 86400000);
}
const levelPool = lvl => QUESTIONS.filter(q => q.lvl === lvl);

// Σταθερό πρόγραμμα (schedule.js): ίδιες 10 ερωτήσεις για όλους ανά ημέρα και επίπεδο.
// Αν η ημέρα λείπει, εφεδρική ντετερμινιστική επιλογή ώστε το παιχνίδι να μη σταματά ποτέ.
function dailySet(key, lvl) {
  const n = dayNumber(key);
  const ids = SCHED[lvl] && SCHED[lvl][key];
  if (ids && ids.every(id => BY_ID.has(id))) return { questions: ids.map(id => BY_ID.get(id)), seed: n * 10 + lvl, scheduled: true };
  const pool = shuffled(levelPool(lvl), rng(lvl * 1000 + BANK_VERSION));
  const out = [];
  for (let k = 0; k < ROUND; k++) out.push(pool[((n * ROUND + k) % pool.length + pool.length) % pool.length]);
  return { questions: out, seed: n * 10 + lvl, scheduled: false };
}
// Εξάσκηση: μόνο το απόθεμα εξάσκησης (PRACTICE) και ερωτήσεις ημερών που έχουν ήδη περάσει,
// ώστε να μη «φανερώνει» μελλοντικά ημερήσια κουίζ· ποτέ ερώτηση που έχει ήδη δει ο παίκτης.
const PRACTICE_IDS = typeof PRACTICE === "object" ? PRACTICE : {};
function practicePool(lvl) {
  const today = todayKey(), ids = new Set(PRACTICE_IDS[lvl] || []);
  for (const [day, list] of Object.entries(SCHED[lvl] || {})) if (day < today) list.forEach(id => ids.add(id));
  return [...ids].filter(id => BY_ID.has(id) && !SEEN.has(id)).map(id => BY_ID.get(id));
}
function practiceSet(lvl) {
  const seed = (Math.random() * 2 ** 31) | 0;
  return { questions: shuffled(practicePool(lvl), rng(seed)).slice(0, ROUND), seed, scheduled: true };
}
function scheduleEnd(lvl) {
  const keys = Object.keys(SCHED[lvl] || {}).sort();
  return keys.length ? keys[keys.length - 1] : "—";
}

// ---------- βαθμολογία ----------
// Όριο «άμεσης γνώσης» για μια ερώτηση στη γλώσσα που εμφανίζεται (ms).
function instantLimitMs(q, lang, totalMs) {
  const chars = q[lang].join("").length;
  return Math.min(INSTANT.baseMs + INSTANT.perCharMs * chars, INSTANT.maxShare * totalMs);
}
// Πόντοι μίας απάντησης: 0 αν λάθος· αλλιώς βάση + ταχύτητα + (άμεση γνώση ? μπόνους : 0).
function pointsFor(correct, leftMs, totalMs, instant) {
  if (!correct) return 0;
  return SCORE.base + Math.round(SCORE.speedMax * Math.max(0, leftMs) / totalMs) + (instant ? SCORE.instant : 0);
}
// Σωρευτικά στοιχεία παίκτη (μόνο ημερήσια κουίζ).
function totals(p, lvl) {

// ---------- συνεχές παιχνίδι (D30) ----------
// Γύροι των 10 χωρίς αναμονή. Πρώτα αθέατες ερωτήσεις (όπως η εξάσκηση)· όταν τελειώσουν, επανάληψη: πρώτα λάθη (2),
// μετά σωστές με σκέψη (1), μετά όλες — ποτέ σημερινού/μελλοντικού ημερήσιου και όχι από τους τελευταίους 40 του συνεδρίου.
let endlessSession = null;
function endlessSet(lvl) {
  const seed = (Math.random() * 2 ** 31) | 0, rand = rng(seed);
  let qs = shuffled(practicePool(lvl), rand).slice(0, ROUND), review = false;
  if (qs.length < ROUND) {
    const today = todayKey(), allowed = new Set(PRACTICE_IDS[lvl] || []);
    for (const [day, list] of Object.entries(SCHED[lvl] || {})) if (day < today) list.forEach(id => allowed.add(id));
    const rv = (P() && P().review) || {}, have = new Set(qs.map(q => q.id));
    const recent = new Set(endlessSession ? endlessSession.recent : []);
    const cand = [...allowed].filter(id => BY_ID.has(id) && SEEN.has(id) && !have.has(id));
    const fresh = cand.filter(id => !recent.has(id)), pool = fresh.length >= ROUND - qs.length ? fresh : cand;
    const keyed = pool.map(id => [-(rv[id] || 0) - rand(), id]).sort((a, b) => a[0] - b[0]);
    qs = qs.concat(keyed.slice(0, ROUND - qs.length).map(([, id]) => BY_ID.get(id)));
    review = true;
  }
  return { questions: qs, seed, scheduled: true, review };
}

function start(mode) {
  const p = P();
  if (!p) { openWelcome(); return; }
  const key = todayKey(), lvl = level(), saved = p.days[`${lvl}|${key}`];
  if (mode === "daily" && saved) { renderResult({ mode, key, level: lvl, ...saved }); return; }
  const live = mode === "daily" && p.live && p.live[`${lvl}|${key}`];
  if (live) { resumeDaily(key, lvl, live); return; }
  if (mode !== "endless") endlessSession = null;                     // νέο συνεχές ξεκινά από την αρχή
  else if (!endlessSession) endlessSession = { rounds: 0, total: 0, recent: [] };
  const set = mode === "daily" ? dailySet(key, lvl) : mode === "endless" ? endlessSet(lvl) : practiceSet(lvl);
  if (!set.questions.length) { goHome(); return; } // δεν υπάρχουν αθέατες ερωτήσεις εξάσκησης
  const rand = rng(set.seed * 7919);
  run = {
    mode, key, level: lvl, rules: mode === "relaxed" ? null : RULES,   // χαλαρή εξάσκηση: χωρίς βαθμολογία
    i: 0, score: 0, correct: 0, instant: 0, grid: [], leaves: 0, times: [],
    scheduled: set.scheduled,
    items: set.questions.map(q => ({ q, order: shuffled([0, 1, 2, 3], rand) })),
    answered: false, deadline: 0, shownAt: 0
  };
  show("game");
  nextQuestion();
}

// ---------- πρόκληση φίλου (Β1) ----------
// Ο κωδικός περιέχει μόνο: επίπεδο, σπόρο σειράς επιλογών, τα 10 id και το αποτέλεσμα του αποστολέα (χωρίς ψευδώνυμο):
//   C1-<επίπεδο>-<σπόρος b36>-<10 id b36 με «.»>-<σκορ>-<σωστές>-<⚡>-<πλέγμα 10 ψηφία>-<έκδοση κανόνων>
// Οι ερωτήσεις έρχονται από το απόθεμα εξάσκησης και από ημερήσια πριν από χθες, ώστε η πρόκληση να μη «χαλά»
// το σημερινό ή μελλοντικό ημερήσιο κανενός (ούτε σε άλλη ζώνη ώρας). Μία προσπάθεια ανά πρόκληση και παίκτη.
const GRID_MARKS = ["⬛", "⬜", "🟥", "🟩", "⚡"];   // ψηφίο του κωδικού = θέση στον πίνακα
const CHALLENGE_KEEP = 50;                          // πόσες προκλήσεις κρατά κάθε παίκτης
let pendingChallenge = null;                        // κωδικός από σύνδεσμο (#c=…) που περιμένει παίκτη
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return todayKey(d); }
function recentDailyIds(lvl) {
  const from = yesterdayKey(), ids = new Set();
  for (const [day, list] of Object.entries(SCHED[lvl] || {})) if (day >= from) list.forEach(id => ids.add(id));
  return ids;
}
function challengePool(lvl) {
  const before = yesterdayKey(), ids = new Set(PRACTICE_IDS[lvl] || []);
  for (const [day, list] of Object.entries(SCHED[lvl] || {})) if (day < before) list.forEach(id => ids.add(id));
  return [...ids].filter(id => BY_ID.has(id) && !SEEN.has(id)).map(id => BY_ID.get(id));
}
const challengeId = (lvl, seed, ids) => `${lvl}-${seed.toString(36)}-${ids.map(i => i.toString(36)).join(".")}`;
function challengeCode(c, r) {
  const grid = Array.from(r.grid).map(g => Math.max(0, GRID_MARKS.indexOf(g))).join("");
  return `C1-${challengeId(c.lvl, c.seed, c.ids)}-${r.score}-${r.correct}-${r.instant}-${grid}-${r.rules}`;
}
// Δέχεται σκέτο κωδικό, σύνδεσμο ή ολόκληρο το μήνυμα κοινοποίησης. Σφάλματα: format, bank, future.
function parseChallenge(text) {
  const raw = (String(text).match(/C1-[0-9a-z.\-]+/) || [""])[0];
  const m = /^C1-([123])-([0-9a-z]{1,7})-([0-9a-z]{1,6}(?:\.[0-9a-z]{1,6}){9})-(\d{1,5})-(\d{1,2})-(\d{1,2})-([0-4]{10})-(\d{1,3})$/.exec(raw);
  if (!m) throw new Error("format");
  const lvl = Number(m[1]), seed = parseInt(m[2], 36), ids = m[3].split(".").map(s => parseInt(s, 36)), digits = Array.from(m[7]);
  const from = { score: Number(m[4]), correct: Number(m[5]), instant: Number(m[6]), grid: digits.map(d => GRID_MARKS[d]).join(""), rules: Number(m[8]) };
  if (new Set(ids).size !== ROUND || from.rules < 1 || seed > 2 ** 31
      || from.correct !== digits.filter(d => d >= "3").length || from.instant !== digits.filter(d => d === "4").length) throw new Error("format");
  if (ids.some(id => !BY_ID.has(id))) throw new Error("bank");
  if (ids.some(id => BY_ID.get(id).lvl !== lvl)) throw new Error("format");
  const recent = recentDailyIds(lvl);
  if (ids.some(id => recent.has(id))) throw new Error("future");
  return { lvl, seed, ids, from };
}
// spec = null: νέα πρόκληση από τον τρέχοντα παίκτη· αλλιώς αποδοχή πρόκλησης από κωδικό.
function startChallenge(spec) {
  const p = P();
  if (!p) { openWelcome(); return; }
  let c = spec;
  if (!c) {
    const lvl = level(), seed = (Math.random() * 2 ** 31) | 0, pool = challengePool(lvl);
    if (pool.length < ROUND) { goHome(); return; }
    c = { lvl, seed, ids: shuffled(pool, rng(seed)).slice(0, ROUND).map(q => q.id), from: null };
  }
  const rand = rng(c.seed * 7919);
  run = {
    mode: "challenge", key: todayKey(), level: c.lvl, rules: RULES, i: 0, score: 0, correct: 0, instant: 0, grid: [], leaves: 0, times: [],
    scheduled: true, items: c.ids.map(id => ({ q: BY_ID.get(id), order: shuffled([0, 1, 2, 3], rand) })),
    answered: false, deadline: 0, shownAt: 0, challenge: { ...c, cid: challengeId(c.lvl, c.seed, c.ids) }
  };
  show("game");
  nextQuestion();
}
// Η προσπάθεια γράφεται σε κάθε βήμα (όπως το ημερήσιο, Β10): αν η εφαρμογή κλείσει, δεν ξαναπαίζεται.
function syncChallenge(p) {
  const c = run.challenge;
  p.challenges = p.challenges || {};
  p.challenges[c.cid] = { lvl: c.lvl, seed: c.seed, ids: c.ids, score: run.score, correct: run.correct, instant: run.instant,
    grid: run.grid.join(""), leaves: run.leaves, pending: !run.answered, rules: run.rules, done: false, at: new Date().toISOString() };
  const keys = Object.keys(p.challenges);
  if (keys.length > CHALLENGE_KEEP) {
    keys.sort((a, b) => p.challenges[a].at < p.challenges[b].at ? -1 : 1).slice(0, keys.length - CHALLENGE_KEEP)
      .forEach(k => delete p.challenges[k]);
  }
}
// Μισοτελειωμένη προσπάθεια: η ερώτηση που έτρεχε μετρά ως έξοδος, οι υπόλοιπες ⬛.
function closeChallenge(p, cid) {
  const s = p.challenges[cid];
  if (s.done) return s;
  let grid = Array.from(s.grid);
  if (s.pending) {
    const q = BY_ID.get(s.ids[grid.length]);
    if (q) recordAnswer(q, false, false, p);
    grid.push("⬛"); s.leaves++;
  }
  while (grid.length < s.ids.length) grid.push("⬛");
  Object.assign(s, { grid: grid.join(""), pending: false, done: true });
  save();
  return s;
}
function challengeResult(s, from) {
  return { mode: "challenge", key: todayKey(), level: s.lvl, score: s.score, correct: s.correct, instant: s.instant,
    total: s.ids.length, grid: s.grid, leaves: s.leaves, scheduled: true, rules: s.rules, ids: s.ids,
    challenge: { lvl: s.lvl, seed: s.seed, ids: s.ids, cid: challengeId(s.lvl, s.seed, s.ids), from } };
}
let shownChallenge = null;
// Άνοιγμα κωδικού: αν ο παίκτης έχει ήδη παίξει την πρόκληση, μόνο σύγκριση· αλλιώς οθόνη αποδοχής.
function openChallenge(text) {
  const p = P();
  if (!p) { pendingChallenge = text; openWelcome(); return; }
  applyLang();                     // στην εκκίνηση από σύνδεσμο τα κείμενα δεν έχουν γραφτεί ακόμη
  let c;
  try { c = parseChallenge(text); }
  catch (e) {
    goHome(); $("chBox").classList.remove("hidden");
    $("chMsg").className = "msg bad"; $("chMsg").textContent = T().chBad[e.message] || T().chBad.format;
    return;
  }
  const cid = challengeId(c.lvl, c.seed, c.ids), mine = p.challenges && p.challenges[cid];
  if (mine) { renderResult({ ...challengeResult(closeChallenge(p, cid), c.from), fresh: [] }); return; }
  shownChallenge = c;
  renderChallenge();
  show("challenge");
}
function renderChallenge() {
  const c = shownChallenge;
  if (!c) return;
  $("chFrom").textContent = T().chFrom(LEVELS[c.lvl][state.lang], c.from.score, c.from.correct, ROUND, c.from.instant);
  $("chGrid").textContent = c.from.grid;
  const seen = c.ids.filter(id => SEEN.has(id)).length, warn = [];
  if (seen) warn.push(T().chSeen(seen));
  if (c.from.rules !== RULES) warn.push(T().chOtherRules(c.from.rules));
  $("chWarn").textContent = warn.join(" ");
  $("chWarn").classList.toggle("hidden", !warn.length);
}
// Κείμενο σύγκρισης στο αποτέλεσμα.
function renderVs(r) {
  const box = $("vsBox"), c = r.challenge;
  box.replaceChildren();
  box.classList.toggle("hidden", !c);
  if (!c) return;
  const line = t => { const d = document.createElement("div"); d.textContent = t; box.append(d); return d; };
  if (!c.from) { line(T().chSendHint); return; }
  const f = c.from, verdict = r.score !== f.score ? (r.score > f.score ? "win" : "lose")
    : r.correct !== f.correct ? (r.correct > f.correct ? "win" : "lose") : "tie";
  line(T()[verdict]).className = "verdict";
  line(T().vsLine(T().me, r.score, r.correct, r.total, r.instant || 0));
  line(r.grid).className = "vsgrid";
  line(T().vsLine(T().them, f.score, f.correct, ROUND, f.instant));
  line(f.grid).className = "vsgrid";
  if (f.rules !== (r.rules || 1)) line(T().chOtherRules(f.rules)).className = "muted small";
}

// ---------- συνέχιση ημερήσιου μετά από διακοπή (Β10) ----------
// Η πρόοδος του ημερήσιου γράφεται στο p.live["επίπεδο|ημέρα"] όταν εμφανίζεται κάθε ερώτηση (pending: true)
// και μετά από κάθε απάντηση (pending: false). Αν η εφαρμογή κλείσει, ο γύρος συνεχίζει από το ίδιο σημείο·
// η ερώτηση που έτρεχε μετρά ως έξοδος (⬛), άρα καμία ερώτηση δεν παίζεται δεύτερη φορά.
function syncLive() {
  const p = P();
  if (run && run.mode === "challenge" && p) { syncChallenge(p); return; }
  if (!run || run.mode !== "daily" || !p) return;
  (p.live = p.live || {})[`${run.level}|${run.key}`] = {
    ids: run.items.map(it => it.q.id), orders: run.items.map(it => it.order),
    done: run.grid.length, pending: !run.answered,
    score: run.score, correct: run.correct, instant: run.instant, grid: run.grid.slice(), leaves: run.leaves,
    times: run.times.slice(), scheduled: run.scheduled, rules: run.rules
  };
}
function dropLive(p, k) {
  if (!p.live) return;
  delete p.live[k];
  if (!Object.keys(p.live).length) delete p.live;
}
function resumeDaily(key, lvl, L) {
  const items = L.ids.map((id, j) => ({ q: BY_ID.get(id), order: L.orders[j] }));
  // Η τράπεζα ή οι κανόνες βαθμολογίας άλλαξαν στο μεταξύ: ο γύρος κλείνει, ώστε να μην ανακατευτούν δύο εκδόσεις κανόνων.
  if (items.some(it => !it.q) || (L.rules || 1) !== RULES) { closeLive(P(), `${lvl}|${key}`); start("daily"); return; }
  run = {
    mode: "daily", key, level: lvl, i: L.done, score: L.score, correct: L.correct, instant: L.instant,
    grid: L.grid.slice(), leaves: L.leaves, times: L.times.slice(), scheduled: L.scheduled,
    rules: L.rules || 1,             // γύρος της v7 (χωρίς πεδίο) = κανόνες 1
    items, answered: false, deadline: 0, shownAt: 0
  };
  show("game");
  if (!L.pending) { nextQuestion(); return; }
  // Η ερώτηση έτρεχε όταν έκλεισε η εφαρμογή: εμφανίζεται ήδη ακυρωμένη, με τη σωστή απάντηση και την εξήγηση.
  renderQuestion(false);
  $("timerBar").style.transform = "scaleX(0)"; $("timeLeft").textContent = "0"; $("timerRing").style.strokeDashoffset = String(RING);
  run.shownAt = run.deadline = performance.now();
  run.leaves++;
  answer(null, "left");
}
// Μισοτελειωμένο ημερήσιο προηγούμενης ημέρας: κλείνει με ό,τι κερδήθηκε· η ερώτηση που έτρεχε μετρά ως έξοδος,
// όσες δεν εμφανίστηκαν ποτέ ως ⬛ χωρίς πόντους (και μένουν «αθέατες» για την εξάσκηση).
function closeLive(p, k) {
  const L = p.live[k], grid = L.grid.slice();
  let leaves = L.leaves;
  if (L.pending) {
    const q = QUESTIONS.find(x => x.id === L.ids[L.done]);   // όχι BY_ID: καλείται και από το loadPlayer() στην εκκίνηση
    if (q) recordAnswer(q, false, false, p);
    grid.push("⬛"); leaves++;
  }
  while (grid.length < L.ids.length) grid.push("⬛");
  p.days[k] = { score: L.score, correct: L.correct, instant: L.instant, total: L.ids.length, grid: grid.join(""),
    leaves, scheduled: L.scheduled, medianMs: median(L.times), times: L.times.slice(), ids: L.ids, rules: L.rules || 1 };
  dropLive(p, k);
  save();
}
function tidyLive(p) {
  if (!p.live || typeof p.live !== "object") { delete p.live; return; }
  const today = todayKey();
  for (const k of Object.keys(p.live)) {
    if (p.days[k]) dropLive(p, k);                       // ήδη ολοκληρωμένο (π.χ. από δεύτερη καρτέλα)
    else if (k.slice(2) < today) closeLive(p, k);
  }
}
function median(times) {   // από τη v11: σε άρτιο πλήθος ο μέσος όρος των δύο μεσαίων τιμών
  const t = times.slice().sort((a, b) => a - b), h = t.length >> 1;
  return !t.length ? null : t.length % 2 ? t[h] : Math.round((t[h - 1] + t[h]) / 2);
}

function nextQuestion() {
  if (run.i >= run.items.length) return finish();
  run.answered = false;
  syncLive();
  markSeen(run.items[run.i].q.id);
  save();
  run.shownAt = performance.now();
  run.deadline = run.shownAt + seconds() * 1000;
  renderQuestion(false);
  if (run.mode !== "relaxed") tick();   // χαλαρή εξάσκηση (Β2): χωρίς χρονόμετρο
  speakQuestion();                      // ομιλία (D28): ο χρόνος έχει ήδη ξεκινήσει και τρέχει κανονικά
}

// Κύκλος μόνο όταν όλες οι απαντήσεις χωράνε καθαρά σε τεταρτημόριο: ≤ 22 χαρακτήρες και καμία λέξη > 12.
// Αλλιώς λίστα (στην τράπεζα: κύκλος ~81% των ερωτήσεων στα ελληνικά, ~86% στα αγγλικά).
const CIRCLE_MAX = { chars: 22, word: 12 };
const fitsCircle = texts => texts.every(t => t.length <= CIRCLE_MAX.chars && t.split(/\s+/).every(w => w.length <= CIRCLE_MAX.word));
// Κουκίδες προόδου: μία ανά ερώτηση, με το χρώμα του αποτελέσματος (⚡ ώχρα, σωστό πράσινο, λάθος κόκκινο).
const DOT_CLASS = { "⚡": "inst", "🟩": "ok", "🟥": "bad", "⬜": "to", "⬛": "left" };
function renderDots() {
  const box = $("dots");
  if (!run) return;
  box.replaceChildren(...run.items.map((_, i) => {
    const d = document.createElement("span");
    d.className = run.grid[i] ? DOT_CLASS[run.grid[i]] || "" : i === run.i ? "cur" : "";
    return d;
  }));
}
function renderQuestion(keepState) {
  const { q, order } = run.items[run.i];
  const data = q[state.lang];
  $("progress").textContent = `${T().q} ${run.i + 1}/${run.items.length}`;
  $("category").textContent = CATEGORIES[q.cat][state.lang];
  $("game").classList.toggle("relaxed", run.mode === "relaxed");
  if (!keepState) { $("game").classList.remove("urgent"); $("timerRing").style.strokeDashoffset = "0"; }
  renderDots();
  renderSpeechRow();
  if (run.mode === "relaxed") $("timeLeft").textContent = T().noTimer;
  $("question").textContent = data[0];
  $("game").dataset.level = run.level;
  $("dial").classList.toggle("list", state.layout === "list" || !fitsCircle(order.map(o => data[1 + o])));
  const box = $("options");
  const prev = keepState ? [...box.children].map(b => b.className) : null;
  box.replaceChildren();
  order.forEach((optIdx, pos) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = prev ? prev[pos] : "opt"; b.dataset.opt = optIdx;
    b.disabled = run.answered;
    const k = document.createElement("span"); k.className = "key"; k.textContent = T().keys[pos];
    const txt = document.createElement("span"), len = data[1 + optIdx].length;
    const word = Math.max(...data[1 + optIdx].split(/\s+/).map(w => w.length));
    txt.className = "txt" + (word > 9 ? " len-w" : len > 16 ? " len-l" : len > 11 ? " len-m" : ""); txt.textContent = data[1 + optIdx];
    const mark = document.createElement("span"); mark.className = "mark"; mark.setAttribute("aria-hidden", "true");
    b.append(k, txt, mark);
    b.addEventListener("click", () => answer(optIdx));
    box.append(b);
  });
  if (!keepState) { $("feedback").textContent = ""; $("feedback").className = "feedback"; }
  renderExplain();
}

// Μετά την απάντηση: εξήγηση + πηγή + κουμπί «Επόμενη». Το επόμενο χρονόμετρο ξεκινά μόνο όταν το πατήσεις,
// άρα το άνοιγμα της πηγής (που κρύβει την εφαρμογή) δεν ακυρώνει τίποτα.
function renderExplain() {
  const on = !!(run && run.answered);
  const has = on && fillExplain($("explainText"), $("explainSrc"), run.items[run.i].q);
  $("explain").classList.toggle("hidden", !has);
  $("nextBtn").classList.toggle("hidden", !on);
  $("nextBtn").textContent = run && run.i + 1 >= run.items.length ? T().toResult : T().nextQ;
}
function advance() {
  if (!run || !run.answered) return;
  run.i++;
  nextQuestion();
}

// Στην εξοικονόμηση το χρονόμετρο ανανεώνεται 4 φορές/δευτ. αντί για ~60 (λιγότερη δουλειά για CPU/οθόνη).
// Κλεψύδρα: «επείγον» τα τελευταία 5″, ή το τελευταίο 35% σε πολύ σύντομο χρόνο (Expert 12″ → 4,2″).
const urgentMs = total => Math.min(5000, 0.35 * total);
const RING = 2 * Math.PI * 19;   // περίμετρος του δαχτυλιδιού της κλεψύδρας (r = 19 στο viewBox 44)
function tick() {
  clearTimeout(timerId); cancelAnimationFrame(timerId);
  const total = seconds() * 1000;
  const step = () => {
    if (!run || run.answered) return;
    const left = Math.max(0, run.deadline - performance.now());
    $("timerBar").style.transform = `scaleX(${left / total})`;
    $("timeLeft").textContent = String(Math.ceil(left / 1000));
    $("timerRing").style.strokeDashoffset = String(RING * (1 - left / total));
    $("timerBox").setAttribute("aria-label", `${Math.ceil(left / 1000)} ${T().s}`);
    $("game").classList.toggle("urgent", left <= urgentMs(total));
    if (left <= 0) return answer(null);
    timerId = effectiveMode() === "saver" ? setTimeout(step, 250) : requestAnimationFrame(step);
  };
  step();
}

// reason: undefined = κανονική απάντηση, "left" = ο παίκτης έφυγε από την εφαρμογή
function answer(optIdx, reason) {
  if (!run || run.answered) return;
  run.answered = true;
  stopSpeech();
  $("game").classList.remove("urgent");
  clearTimeout(timerId); cancelAnimationFrame(timerId);
  const now = performance.now(), total = seconds() * 1000;
  const left = Math.max(0, run.deadline - now), elapsed = now - run.shownAt;
  const { q } = run.items[run.i];
  const ok = optIdx === 0 && reason !== "left"; // στην τράπεζα η σωστή είναι πάντα η πρώτη επιλογή
  const timed = run.mode !== "relaxed";       // χαλαρή εξάσκηση: χωρίς πόντους και χωρίς ⚡
  const instant = timed && ok && elapsed <= instantLimitMs(q, state.lang, total);
  if (timed) run.score += pointsFor(ok, left, total, instant);
  if (ok) run.correct++;
  if (instant) run.instant++;
  if (optIdx !== null) run.times.push(Math.round(elapsed));
  run.grid.push(reason === "left" ? "⬛" : instant ? "⚡" : ok ? "🟩" : optIdx === null ? "⬜" : "🟥");
  syncLive();                     // μία αποθήκευση (μέσα στο recordAnswer) για πρόοδο και στατιστικά μαζί
  renderDots();
  recordAnswer(q, ok, instant);
  [...$("options").children].forEach(b => {
    b.disabled = true;
    const v = Number(b.dataset.opt);
    if (v === optIdx) b.classList.add("picked");
    if (v === 0) b.classList.add("correct");
    else if (v === optIdx) b.classList.add("wrong");
  });
  const fb = $("feedback");
  fb.replaceChildren();
  if (instant) { const s = document.createElement("span"); s.className = "instant"; s.textContent = T().instantHit; fb.append(s); }
  else {
    const streak = trailingCorrect();
    fb.textContent = reason === "left" ? T().left : ok ? (streak >= 3 ? T().streakMsg(streak) : pickOne(T().cheers))
      : optIdx === null ? T().timeout : pickOne(T().misses);
  }
  fb.className = "feedback pop " + (ok ? "ok" : "bad");
  if (ok) { burst([...$("options").children].find(b => b.dataset.opt === "0"), instant); playSound(instant ? "instant" : "ok"); }
  else if (reason !== "left") playSound(optIdx === null ? "timeout" : "bad");
  renderExplain();
  if (reason !== "left") $("nextBtn").focus({ preventScroll: true });
}

document.addEventListener("visibilitychange", () => {

});

function finish() {
  stopSpeech();
  const r = {
    mode: run.mode, key: run.key, level: run.level, score: run.score, correct: run.correct, instant: run.instant,
    total: run.items.length, grid: run.grid.join(""), leaves: run.leaves, scheduled: run.scheduled, rules: run.rules,
    medianMs: median(run.times),                                          // για μελλοντικό έλεγχο κατάταξης
    times: run.times.slice(),                                             // χρόνοι απαντήσεων (ms) για τους δείκτες (Β3/Β11)
    ids: run.items.map(it => it.q.id)                                     // για την ανασκόπηση απαντήσεων
  };
  if (run.mode === "daily" && P()) {
    const { mode, key, level: lvl, ...rest } = r;
    P().days[`${lvl}|${key}`] = rest;
    dropLive(P(), `${lvl}|${key}`);
    save();
  }
  if (run.mode === "endless" && P() && endlessSession) {
    const es = endlessSession, p = P(), e = (p.endless = p.endless || { best: 0, bestRound: 0, bestRounds: 0, rounds: 0 });
    es.rounds++; es.total += r.score;
    es.recent = es.recent.concat(r.ids).slice(-40);
    e.rounds++; e.best = Math.max(e.best, es.total); e.bestRound = Math.max(e.bestRound, r.score);
    e.bestRounds = Math.max(e.bestRounds, es.rounds);
    save();
    r.session = { rounds: es.rounds, total: es.total, best: e.best };
  }
  if (run.mode === "challenge" && P()) {
    syncChallenge(P());
    P().challenges[run.challenge.cid].done = true;
    save();
    const { cid, ...c } = run.challenge;
    r.challenge = { ...c, cid };
  }
  run = null;
  r.fresh = unlockAchievements(P()).map(a => a[0]);
  renderResult(r);
  if (r.fresh.length) { playSound("ach"); burst($("newAch"), true); }
  else if (r.correct >= 8) { playSound("fanfare"); burst($("resultScore"), true); }
}

function stats(lvl, p = P()) {
  const days = (p && p.days) || {}, prefix = `${lvl}|`;
  const keys = Object.keys(days).filter(k => k.startsWith(prefix));
  let streak = 0;
  const d = new Date();
  if (!days[prefix + todayKey(d)]) d.setDate(d.getDate() - 1); // το σερί δεν σπάει πριν παίξεις σήμερα
  while (days[prefix + todayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
  const best = keys.reduce((m, k) => Math.max(m, days[k].score), 0);
  return { played: keys.length, streak, best, total: totals(p, lvl).points };
}

// Μόνο ημερήσια κουίζ (ίδιες ερωτήσεις και κανόνες για όλους). Ορισμοί: UI.kpiDef και HANDBOOK §5.8.
const HISTORY_SHOW = 30;
function indicators(p, lvl) {
  let days = 0, questions = 0, ok = 0, inst = 0, score = 0;
  const times = [];
  for (const [k, d] of dailyList(p)) {
    if (lvl && !k.startsWith(`${lvl}|`)) continue;
    days++; questions += d.total || ROUND; ok += d.correct || 0; inst += d.instant || 0; score += d.score || 0;
    if (Array.isArray(d.times)) d.times.forEach(x => { if (Number.isFinite(x) && x >= 0) times.push(x); });
  }
  return { days, knowledge: questions ? ok / questions : null, instantShare: ok ? inst / ok : null,
    medianMs: median(times), meanMs: times.length ? times.reduce((a, b) => a + b, 0) / times.length : null,
    avgScore: days ? score / days : null, answers: times.length };
}
function fmtPct(x) { return x === null ? "—" : `${Math.round(100 * x)}%`; }
function fmtSec(ms) {
  return ms === null ? "—" : (ms / 1000).toLocaleString(state.lang === "el" ? "el-GR" : "en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "″";
}
function renderIndicators(p) {
  const all = indicators(p);
  $("kpiKnow").textContent = fmtPct(all.knowledge); $("kpiSpeed").textContent = fmtSec(all.medianMs);
  $("kpiMean").textContent = fmtSec(all.meanMs); $("kpiInstant").textContent = fmtPct(all.instantShare);
  const head = $("lvlHead"), body = $("lvlBody");

// Ιστορικό: ημερήσια (days) και ολοκληρωμένες προκλήσεις (challenges), νεότερα πρώτα.
function historyRows(p) {
  const rows = dailyList(p).map(([k, d]) => ({ kind: "daily", day: k.slice(2), lvl: Number(k[0]), d }));
  for (const s of Object.values(p.challenges || {})) {
    if (s.done) rows.push({ kind: "challenge", day: s.at ? todayKey(new Date(s.at)) : "", lvl: s.lvl, d: s, at: s.at || "" });
  }
  return rows.sort((a, b) => b.day.localeCompare(a.day) || (a.kind === b.kind ? (b.at || "").localeCompare(a.at || "") || a.lvl - b.lvl
    : a.kind === "daily" ? -1 : 1));
}
function renderHistory(p) {
  const list = $("histList"), rows = historyRows(p);
  list.replaceChildren();
  if (!rows.length) { const li = document.createElement("li"); li.className = "muted small"; li.textContent = T().histEmpty; list.append(li); return; }
  const loc = state.lang === "el" ? "el-GR" : "en-GB";
  rows.slice(0, HISTORY_SHOW).forEach(h => {
    const li = document.createElement("li"), b = document.createElement("button"), g = document.createElement("span");
    b.type = "button";
    const [y, m, d] = h.day.split("-").map(Number);
    const date = h.day ? new Date(y, m - 1, d).toLocaleDateString(loc, { day: "numeric", month: "short" }) : "";
    b.textContent = `${date} · ${h.kind === "daily" ? T().histDaily : T().histChallenge} · ${LEVELS[h.lvl][state.lang]} · `
      + `${(h.d.score || 0).toLocaleString(loc)} · ${h.d.correct}/${h.d.total || (h.d.ids || []).length || ROUND} · ⚡ ${h.d.instant || 0}`;

      ? { mode: "daily", key: h.day, level: h.lvl, ...h.d, fresh: [] } : { ...challengeResult(h.d, null), fresh: [] }));
    li.append(b); list.append(li);
  });
}

// Αντίστροφη μέτρηση μέχρι τα μεσάνυχτα (νέο ημερήσιο), ζωντανή ανά δευτερόλεπτο, στο αποτέλεσμα και στην αρχική.
function untilMidnight() {
  const now = new Date(), next = new Date(now); next.setHours(24, 0, 0, 0);
  const sec = Math.max(0, Math.floor((next - now) / 1000)), h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function updateCountdown() {
  const r = lastResult, ready = r && r.mode === "daily" && r.key !== todayKey();
  $("nextIn").textContent = ready ? T().nextReady : T().next(untilMidnight());
  $("meanwhile").classList.toggle("hidden", !(r && r.mode === "daily") || ready);
  const p = P(), played = p && p.days[`${level()}|${todayKey()}`];
  $("homeNext").textContent = played ? T().next(untilMidnight()) : "";
  $("homeNext").classList.toggle("hidden", !played);
}
